<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PhonkMusic</title>
</head>
<body>
<P>Welcome to the website PhonkMusic, where you can listen to Phonk</P>
<form action="#" th:action="@{/}" th:object="${personForm}" method="post">
    <table>
        <tr>
            <td>Name:</td>
            <td><input type="text" th:field="*{name}" /></td>
            <td th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</td>
        </tr>
        <tr>
            <td>Age:</td>
            <td><input type="text" th:field="*{age}" /></td>
            <td th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age Error</td>
        </tr>
        <tr>
            <td>Вo you want pulsating animations on your website?</td>
            <td>
                <select th:field="*{type}">
                    <option value="1" th:selected="${personForm.type == 1}">Yes</option>
                    <option value="2" th:selected="${personForm.type == 2}">No</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><button type="submit">Submit</button></td>
        </tr>
    </table>
</form>
</body>
</html>
